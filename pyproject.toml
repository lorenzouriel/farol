[project]
name = "farol"
version = "0.1.0"
description = "Local public-data lakehouse"
requires-python = ">=3.11"
dependencies = ["pyspark[connect]==3.5.6", "pandas>=2,<3", "pyarrow>=15", "trino>=0.333", "requests>=2.31", "pyyaml>=6", "boto3>=1.35", "psycopg2-binary>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
