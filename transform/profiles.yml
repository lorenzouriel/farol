farol:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ':memory:'
      extensions:
        - httpfs
        - ducklake
      attach:
        - path: "ducklake:postgres:dbname=ducklake_catalog host={{ env_var('POSTGRES_HOST') }} user={{ env_var('POSTGRES_USER') }} password={{ env_var('POSTGRES_PASSWORD') }}"
          alias: lakehouse
          options:
            data_path: "s3://{{ env_var('FAROL_RAW_BUCKET_NAME') }}/lakehouse/"
      settings:
        # duckdb's s3_endpoint wants a bare host:port (it prepends http/https itself
        # based on s3_use_ssl below); MINIO_ENDPOINT carries a scheme everywhere else
        # in the project (docker-compose, dlt), so strip it here rather than diverge.
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT').replace('http://', '').replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY') }}"
        s3_use_ssl: false
        s3_url_style: path
      schema: lakehouse
