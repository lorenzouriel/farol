name: farol
services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    entrypoint:
    - /bin/sh
    - -c
    command:
    - printf '{"identities":[{"name":"lakehouse","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
      "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json && exec weed -v=0 server
      -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=256 -volume.index=leveldb
      -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      GOMEMLIMIT: ${S3_GOMEMLIMIT:-600MiB}
    ports:
    - 127.0.0.1:${S3_PORT:-18333}:8333
    volumes:
    - seaweedfs_data:/data
    mem_limit: ${S3_MEM:-768m}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8333/healthz
      interval: 5s
      timeout: 5s
      retries: 24
  storage-init:
    image: amazon/aws-cli:2.31.6
    entrypoint:
    - /bin/sh
    - -c
    command:
    - aws --endpoint-url http://seaweedfs:8333 s3 ls s3://warehouse || aws --endpoint-url
      http://seaweedfs:8333 s3 mb s3://warehouse
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse123}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      seaweedfs:
        condition: service_healthy
    mem_limit: 128m
  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.2
    user: '0'
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /data/nessie
      JAVA_OPTS_APPEND: -Xmx192m
    ports:
    - 127.0.0.1:${NESSIE_PORT:-29120}:19120
    volumes:
    - nessie_data:/data
    mem_limit: ${NESSIE_MEM:-384m}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fs http://127.0.0.1:9000/q/health/ready >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
  spark-connect:
    build: infra/spark
    image: farol/spark-connect:3.5.6
    environment:
      NESSIE_REF: ${NESSIE_REF:-main}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
      AWS_REGION: us-east-1
    ports:
    - 127.0.0.1:${SPARK_CONNECT_PORT:-25002}:15002
    mem_limit: ${SPARK_MEM:-1792m}
    depends_on:
      nessie:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/15002'
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s
  trino:
    image: trinodb/trino:476
    environment:
      NESSIE_REF: ${NESSIE_REF:-main}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse123}
    ports:
    - 127.0.0.1:${TRINO_PORT:-18080}:8080
    volumes:
    - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro
    - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
    - ./infra/trino/etc/node.properties:/etc/trino/node.properties:ro
    - ./infra/trino/catalog:/etc/trino/catalog:ro
    mem_limit: ${TRINO_MEM:-2048m}
    depends_on:
      nessie:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/lib/trino/bin/health-check
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  meta-db:
    image: postgres:17
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:-lakehouse}
      POSTGRES_DB: lakehouse
    volumes:
    - meta_db_data:/var/lib/postgresql/data
    - ./infra/meta-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: ${META_DB_MEM:-192m}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U lakehouse -d lakehouse
      interval: 5s
      timeout: 5s
      retries: 12
  airflow:
    build: infra/airflow
    image: farol/airflow:3.1.0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/lakehouse/orchestration/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'True'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://lakehouse:${META_DB_PASSWORD:-lakehouse}@meta-db:5432/airflow
      AIRFLOW__API__WORKERS: '1'
      PYTHONPATH: /opt/lakehouse/src
      SPARK_REMOTE: sc://spark-connect:15002
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      DBT_BIN: /opt/airflow/dbt-venv/bin/dbt
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-logs
      EXTRACT_POOL_SLOTS: ${EXTRACT_POOL_SLOTS:-2}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
    ports:
    - 127.0.0.1:${AIRFLOW_PORT:-18081}:8080
    volumes:
    - ./src:/opt/lakehouse/src:ro
    - ./orchestration:/opt/lakehouse/orchestration:ro
    - ./dbt:/opt/lakehouse/dbt:ro
    - airflow_logs:/opt/airflow/logs
    mem_limit: ${AIRFLOW_MEM:-1536m}
    depends_on:
      meta-db:
        condition: service_healthy
      trino:
        condition: service_healthy
      spark-connect:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fs http://127.0.0.1:8080/api/v2/monitor/health >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  superset:
    build: infra/superset
    image: farol/superset:5.0.0
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-local-lab-only}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      META_DB_PASSWORD: ${META_DB_PASSWORD:-lakehouse}
      SUPERSET_URL: http://127.0.0.1:8088
    ports:
    - 127.0.0.1:${SUPERSET_PORT:-18088}:8088
    mem_limit: ${SUPERSET_MEM:-768m}
    depends_on:
      meta-db:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fs http://127.0.0.1:8088/health >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
volumes:
  seaweedfs_data: null
  nessie_data: null
  meta_db_data: null
  airflow_logs: null
