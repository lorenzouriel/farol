catalog: 'mcp-brasil — v1 scope: despesas públicas (public expenses)'
version: v1
derived_from: mcp_brasil_sources.yaml
scope:
  definition: 'Execução da despesa pública (empenho → liquidação → pagamento) e gastos diretos atribuíveis: cota parlamentar, cartão corporativo, viagens a serviço, emendas, relatórios fiscais de execução
    (RREO/RGF/DCA) e índices de aplicação mínima (MDE/ASPS).'
  includes:
  - despesa por órgão / função / favorecido
  - documentos e itens de empenho
  - cartão de pagamento (suprimento de fundos)
  - viagens a serviço
  - emendas parlamentares (execução)
  - CEAP de deputados
  - execução orçamentária de estados/municípios (SICONFI)
  - despesas municipais via TCEs (SP, PE, PI, RN, CE, RS)
  - empenhos e faturas de contratos federais
  excludes: receitas, contratos/licitações como objeto principal, transferências a terceiros não federais, folha de pagamento individual, benefícios sociais, renúncia fiscal, contas de campanha
totals:
  sources: 10
  tools: 42
  core_tools: 27
  lookup_or_support_tools: 15
  keys_required:
  - TRANSPARENCIA_API_KEY
  note: Só o Portal da Transparência exige chave no v1; todas as demais fontes são abertas.
question_router:
