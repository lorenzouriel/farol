known_gaps:
- gap: 'Senado: CEAPS (cota dos senadores) não implementado'
  impact: Pergunta 'gastos do senador X' não tem resposta no v1
  fix: Nova tool sobre os dados abertos administrativos do Senado (CEAPS) — endpoint a validar
- gap: 'TCEs sem endpoint de despesa: RJ, ES, SC, TO, PA'
  impact: Municípios desses estados só via SICONFI (agregado, sem nível de empenho)
- gap: Nenhum teste de contrato contra upstream
  impact: Mudança de payload quebra silenciosamente
  fix: Smoke test diário em 1 chamada por tool core
- gap: returned_fields de TCEs vêm de modelos Pydantic parciais
  impact: Campos de valor (empenhado/liquidado/pago) variam por TCE; normalizar num modelo canônico de despesa
deferred_to_v2:
- id: transferegov
  tools: emendas PIX
  reason: Transferência especial ao ente; a despesa final ocorre no município
- id: transparencia
  tools: buscar_convenios, detalhar_convenio, consultar_coronavirus_transferencias
  reason: Transferências voluntárias — despesa da União, mas execução no convenente
- id: transparencia
  tools: buscar_remuneracoes_servidores, detalhar_servidor
  reason: Despesa de pessoal, porém PII individual; tratar à parte com LGPD
- id: transparencia
  tools: consultar_bolsa_familia, consultar_beneficio_social, seguro_defeso, garantia_safra, peti
  reason: Benefícios sociais — outro domínio
- id: transparencia
  tools: buscar_renuncias_fiscais
  reason: Gasto tributário (receita não arrecadada), não desembolso
- id: transparencia
  tools: buscar_notas_fiscais, buscar_nota_fiscal_chave
  reason: Documento fiscal; útil para drill-down de v2
- id: compras / tce_* contratos e licitações
  reason: Compromisso contratual, não execução
- id: tse, tse_fefc
  reason: Contas de campanha e fundo eleitoral — domínio eleitoral, risco legal alto
- id: tce_rj.buscar_prestacao_contas
  reason: Metadados de processo de contas, sem valores de despesa
- id: fnde
  reason: Retorna quantitativos (alunos/livros), não valores repassados
